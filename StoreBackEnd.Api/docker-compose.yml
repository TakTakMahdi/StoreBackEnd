name: storebackend
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: storebackend-sql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${SQL_PASSWORD:?SQL_PASSWORD is required}"
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -l 5 > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 60s
    mem_limit: 3g
    cpus: 2.0
    networks:
      - storebackend-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: storebackend-api
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=StoreBackEndDb;User Id=sa;Password=${SQL_PASSWORD:?SQL_PASSWORD is required};Encrypt=True;TrustServerCertificate=True;"
      Jwt__Cle: "${JWT_SECRET:?JWT_SECRET is required}"
      Jwt__Emetteur: "StoreBackEnd.Api"
      Jwt__Audience: "StoreBackEnd.Clients"
      Jwt__DureeMinutesAccessToken: "30"
      Jwt__DureeJoursRefreshToken: "3"
    volumes:
      - dataprotection_keys:/app/keys
    ports:
      - "127.0.0.1:8080:8080"
    mem_limit: 1g
    cpus: 1.5
    networks:
      - storebackend-network

volumes:
  sql_data:
    name: storebackendapi_sql_data
  dataprotection_keys:
    name: storebackendapi_dataprotection_keys
networks:
  storebackend-network:
    driver: bridge
  